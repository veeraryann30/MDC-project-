<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catch the Phish</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="popup">
  <header>
    <img src="icons/icon48.png" alt="" width="28" height="28" />
    <h1>Catch the Phish</h1>
  </header>

  <form id="form" autocomplete="off">
    <label for="link">Link to check</label>
    <input id="link" type="text" spellcheck="false" placeholder="Paste a link or use this page" />
    <button id="go" type="submit">Check link</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <section id="result" hidden>
    <div id="badge"></div>
    <p id="domain"></p>
    <ul id="reasons"></ul>
    <a id="report" href="#" target="_blank" rel="noopener">Open full report</a>
  </section>

  <p class="foot"><a id="settings" href="#">Settings</a> · Links are analysed from their text and never opened.</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
