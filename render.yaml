# Render Blueprint for the Catch the Phish API (FastAPI).
# Deploy: Render dashboard -> New -> Blueprint -> select this repository.
# After the first deploy, set CORS_ORIGINS to your Vercel URL (see docs/DEPLOYMENT.md).
services:
  - type: web
    name: catch-the-phish-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false   # set in the dashboard, e.g. https://your-app.vercel.app
      - key: DATABASE_URL
        sync: false   # set in the dashboard to your Postgres connection string (see docs/DEPLOYMENT.md).
        # If left unset the app falls back to a local SQLite file, which Render's free plan wipes on every restart.
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: IPINFO_API_KEY
        sync: false
      - key: GOOGLE_WEB_RISK_API_KEY
        sync: false
      - key: URLHAUS_AUTH_KEY
        sync: false
      - key: URLSCAN_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
