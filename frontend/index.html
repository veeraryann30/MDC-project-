<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catch the Phish | Don't trust the link. Verify it.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="description" content="Explainable Phishing URL Intelligence Platform combining real-time lexical inspection, brand impersonation analysis, and machine learning." />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        var t = localStorage.getItem('catch_the_phish_theme') || 'light';
        var r = document.documentElement;
        r.classList.remove('light', 'dark');
        r.classList.add(t === 'dark' ? 'dark' : 'light');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </body>
</html>
